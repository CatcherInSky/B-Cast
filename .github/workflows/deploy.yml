name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Install dependencies
        working-directory: backend
        run: pnpm install
      
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ Missing required secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.D1_DATABASE_NAME }}" ]; then
            echo "❌ Missing required secret: D1_DATABASE_NAME"
            exit 1
          fi
          if [ -z "${{ secrets.D1_DATABASE_ID }}" ]; then
            echo "❌ Missing required secret: D1_DATABASE_ID"
            exit 1
          fi
          if [ -z "${{ secrets.R2_BUCKET_NAME }}" ]; then
            echo "❌ Missing required secret: R2_BUCKET_NAME"
            exit 1
          fi
          echo "✅ All required secrets are present"
      
      - name: Generate wrangler.toml
        run: |
          cat > backend/wrangler.toml << EOF
          name = "b-cast"
          main = "src/index.ts"
          compatibility_date = "2024-01-01"
          
          # D1 Database binding
          [[d1_databases]]
          binding = "DB"
          database_name = "${{ secrets.D1_DATABASE_NAME }}"
          database_id = "${{ secrets.D1_DATABASE_ID }}"
          
          # R2 Storage binding
          [[r2_buckets]]
          binding = "BUCKET"
          bucket_name = "${{ secrets.R2_BUCKET_NAME }}"
          
          # Cron Triggers
          [triggers]
          crons = ["0 2 * * *"]
          
          # Environment variables
          [vars]
          WORKER_URL = "${{ secrets.WORKER_URL }}"
          EOF
      
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend
        run: pnpm exec wrangler deploy
      
      - name: Check deployment
        run: |
          echo "✅ Backend deployed successfully"
  
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build
        working-directory: frontend
        run: |
          if [ -n "${{ secrets.WORKER_URL }}" ]; then
            export VITE_API_BASE="https://${{ secrets.WORKER_URL }}"
          fi
          npm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          cname: ${{ secrets.CUSTOM_DOMAIN }}
