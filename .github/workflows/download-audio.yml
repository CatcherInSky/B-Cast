name: Download Audio from Bilibili

on:
  # 允许手动触发
  workflow_dispatch:
  
  # 也可以通过API触发
  repository_dispatch:
    types: [download-audio]

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2小时超时限制
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install yt-dlp and dependencies
        run: |
          pip install yt-dlp requests
      
      - name: Setup Node.js (for Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Get pending downloads from Worker API
        id: get-pending
        run: |
          RESPONSE=$(curl -s "${{ secrets.WORKER_URL }}/api/downloads/pending")
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          COUNT=$(echo $RESPONSE | jq -r '.count')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "📋 Found $COUNT pending downloads"
      
      - name: Download and upload audio files
        if: steps.get-pending.outputs.count != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
        run: |
          python scripts/download_worker.py
      
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-summary
          path: download-summary.json
          retention-days: 7
