name = "b-cast"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# 静态资源：前端构建产物与 Worker 一起部署（同域，无需 CORS）
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "b-cast"
database_id = "671fbc13-8c07-456f-8a27-1b7fdaa33df8"

# R2 Storage binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "b-cast"

# Cron Triggers
[triggers]
crons = ["0 2 * * *"]

# Environment variables
[vars]
WORKER_URL = "b-cast.zhangchunxiang98.workers.dev"
