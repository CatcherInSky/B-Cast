name = "b-cast-mvp"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = true

# 部署前自动执行的构建命令
[build]
command = "npm run build"

# D1 Database Binding
# 创建数据库: wrangler d1 create b-cast-mvp
# 初始化数据库: wrangler d1 execute b-cast-mvp --file=../scripts/download_queue.sql
[[d1_databases]]
binding = "DB"
database_name = "b-cast-mvp"
database_id = ""  # 填入你的 database_id

# R2 Bucket Binding
# 创建存储桶: wrangler r2 bucket create b-cast-audio
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "b-cast-audio"
